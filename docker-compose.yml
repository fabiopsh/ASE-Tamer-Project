# Monster Tamers - full backend (docs/plan/02-infrastructure.md, INFRA-6)
#   docker compose up --build        start everything (secrets generated on first start)
#   docker compose down -v           stop and delete all data and secrets
# Only the gateway publishes a port: https://localhost:8443
# Requires Docker Compose >= 2.30 (volume subpath).

name: tamer

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-after-secrets: &after-secrets
  init-secrets:
    condition: service_completed_successfully

services:
  init-secrets:
    build: infra/init-secrets
    image: tamer/init-secrets:dev
    user: "10001:10001"
    <<: *hardening
    network_mode: none
    volumes:
      - secrets:/secrets

  gateway:
    build: gateway
    image: tamer/gateway:dev
    <<: *hardening
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
    networks:
      - edge
      - backend
    volumes:
      - type: volume
        source: secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: gateway
    healthcheck:
      test: ["CMD", "curl", "-fs", "--cacert", "/run/secrets/ca.crt", "https://localhost:8443/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      <<: *after-secrets
      auth:
        condition: service_healthy
      players:
        condition: service_healthy
      monsters:
        condition: service_healthy
      teams:
        condition: service_healthy
      encounters:
        condition: service_healthy
      history:
        condition: service_healthy

  auth:
    build:
      context: backend
      dockerfile: auth/Dockerfile
    image: tamer/auth:dev
    user: "185"
    <<: *hardening
    restart: unless-stopped
    networks:
      - backend
    environment:
      QUARKUS_PROFILE: prod
      TAMER_PLAYERS_URL: https://players:8443
      TAMER_ACCESS_TOKEN_TTL: "3600"
    volumes:
      - type: volume
        source: secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: auth
    healthcheck:
      test: ["CMD", "curl", "-fs", "--cacert", "/run/secrets/ca.crt", "https://localhost:8443/q/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
    depends_on:
      <<: *after-secrets
      auth-db:
        condition: service_healthy

  auth-db:
    image: postgres:17.11-alpine3.24
    user: "70:70"
    <<: *hardening
    restart: unless-stopped
    networks:
      - backend
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth_app
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    # The server key must be 0600 and owned by the server user: copy it before starting.
    command:
      - sh
      - -c
      - >-
        cp /run/secrets/tls/server.key /tmp/server.key && chmod 600 /tmp/server.key &&
        exec docker-entrypoint.sh postgres -c ssl=on
        -c ssl_cert_file=/run/secrets/tls/server.crt -c ssl_key_file=/tmp/server.key
        -c ssl_min_protocol_version=TLSv1.2
    volumes:
      - auth-db-data:/var/lib/postgresql/data
      - type: volume
        source: secrets
        target: /run/secrets
        read_only: true
        volume:
          subpath: auth-db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "auth_app", "-d", "auth"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      <<: *after-secrets

  players:
    build:
      context: backend
      dockerfile: players/Dockerfile
    image: tamer/players:dev
    user: "185"
    <<: *hardening
    restart: unless-stopped
    networks:
