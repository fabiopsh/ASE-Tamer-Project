networks:
  # Services and databases: no access from or to the outside
  backend:
    internal: true
  # Only the gateway publishes a port
  edge: {}

volumes:
  secrets:
  auth-db-data:
  players-db-data:
  monsters-db-data:
  teams-db-data:
  encounters-db-data:
  history-db-data:
