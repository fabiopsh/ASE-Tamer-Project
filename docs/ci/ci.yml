# Monster Tamers - continuous integration (docs/plan/11-ci-security.md, CI-1 and CI-2).
# A copy of this file is kept in docs/ci/ci.yml (requirements): the docs-sync job checks they are identical.
# Every action is pinned to a commit SHA (tag in the comment) and every tool image to a digest.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_IMAGE: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
  SEMGREP_IMAGE: semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af

jobs:
  # ---------------------------------------------------------------- CI-1: build and test
  backend:
    name: Backend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Quarkus Dev Services start a throw-away PostgreSQL with the runner's Docker
      - run: mvn -B -f backend/pom.xml verify
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: backend/*/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose-smoke:
    name: Compose smoke and API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: docs/tests/bruno/package-lock.json
      - name: Start the stack (test override, waits for the health checks)
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build --wait --wait-timeout 600
      - name: Gateway health over HTTPS (verified against the local CA)
        run: |
          scripts/test-env.sh
          curl -fsS --cacert .test-secrets/ca.crt https://localhost:8443/health
      - name: Plain HTTP to the gateway is refused
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8443/health || true)
          echo "HTTP status: $code"
          test "$code" != "200"
      - name: Bruno component, integration and e2e tests
        working-directory: docs/tests/bruno
        run: |
          npm ci
          npm test
      - name: Service logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml logs --no-color --timestamps
      - name: Stop and delete everything
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v

  docs-sync:
    name: Workflow copy in docs/ci
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: diff -u .github/workflows/ci.yml docs/ci/ci.yml

  # ---------------------------------------------------------------- CI-2: security analysis
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep scan --metrics=off \
            --config p/java --config p/typescript --config p/react --config p/dockerfile \
            --config p/secrets --config p/owasp-top-ten \
            --text --sarif-output=semgrep.sarif --json-output=semgrep.json
      - name: Fail on findings of severity ERROR
        run: |
          errors=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' semgrep.json)
          echo "Semgrep findings with severity ERROR: $errors"
          test "$errors" -eq 0
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep
          path: semgrep.*
          retention-days: 30

  deps:
    name: Dependencies (Trivy fs)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Trivy reads parent poms and transitive dependencies from ~/.m2; --offline-scan keeps it off
      # Maven Central, which rate-limits (429) repeated pom downloads from shared runners.
      - name: Resolve Maven dependencies
        run: mvn -B -q -f backend/pom.xml dependency:resolve
      # Maven poms, package-lock.json files and requirements.txt; .trivyignore lists justified exceptions
      - name: Trivy filesystem scan
        run: |
          docker run --rm -v "$HOME/.cache/trivy:/root/.cache/trivy" -v "$HOME/.m2:/root/.m2:ro" \
            -v "$PWD:/src" -w /src "$TRIVY_IMAGE" \
            fs --offline-scan --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --ignorefile .trivyignore \
            --exit-code 1 .

  images:
    name: Images (Trivy image)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - name: Build every image
        run: |
          docker compose build
          docker compose pull --ignore-buildable
      - name: Trivy image scan (gateway, frontend, six services, init-secrets, postgres)
        run: |
          status=0
          for image in $(docker compose config --images | sort -u); do
            echo "::group::$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" -v "$PWD/.trivyignore:/.trivyignore:ro" "$TRIVY_IMAGE" \
              image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --ignorefile /.trivyignore \
              --exit-code 1 "$image" || status=1
            echo "::endgroup::"
          done
          exit $status

  config:
    name: Misconfigurations (Trivy config)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - name: Trivy config scan (Dockerfiles, compose)
        run: |
          docker run --rm -v "$HOME/.cache/trivy:/root/.cache/trivy" -v "$PWD:/src" -w /src "$TRIVY_IMAGE" \
            config --severity CRITICAL,HIGH --ignorefile .trivyignore --exit-code 1 .
