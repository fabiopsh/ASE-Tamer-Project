# ---------------------------------------------------------------------------
# encounters - see docs/plan/02-infrastructure.md (INFRA-1, INFRA-3, INFRA-4, INFRA-7)
# Profiles: %dev / %test use Dev Services and plain HTTP; %prod (containers) enforces TLS.
# Secrets are never written here: in prod they come from /run/secrets/secrets.properties.
# ---------------------------------------------------------------------------
quarkus.application.name=encounters
%dev.quarkus.http.port=8085
quarkus.http.test-port=0
quarkus.http.auth.proactive=false

# JSON
quarkus.jackson.property-naming-strategy=SNAKE_CASE
quarkus.jackson.fail-on-unknown-properties=true

# Persistence
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
# jsonb columns are mapped with @JdbcTypeCode(SqlTypes.JSON) as JsonNode trees: Hibernate's own format mapper
# (Quarkus 3.39 refuses to boot otherwise, see history)
quarkus.hibernate-orm.mapping.format.global=ignore
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://encounters-db:5432/encounters?sslmode=verify-full&sslrootcert=/run/secrets/ca.crt
%prod.quarkus.datasource.username=encounters_app

# OpenAPI
quarkus.smallrye-openapi.info-title=Monster Tamers - encounters
quarkus.smallrye-openapi.store-schema-directory=target/openapi
# schema property names as on the wire (snake_case)
mp.openapi.extensions.smallrye.property-naming-strategy=LOWER_CASE_WITH_UNDERSCORES

# Logging (request id from RequestIdFilter)
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%X{request_id}] %c{2.} %s%e%n

# JWT verification (all services)
mp.jwt.verify.issuer=tamer-auth
mp.jwt.verify.audiences=tamer-api,tamer-internal
smallrye.jwt.path.groups=groups
%prod.mp.jwt.verify.publickey.location=/run/secrets/jwt-public.pem

# TLS (prod only)
%prod.quarkus.http.ssl-port=8443
%prod.quarkus.http.insecure-requests=disabled
%prod.quarkus.tls.key-store.pem.0.cert=/run/secrets/tls/server.crt
%prod.quarkus.tls.key-store.pem.0.key=/run/secrets/tls/server.key
%prod.quarkus.tls.internal.trust-store.pem.certs=/run/secrets/ca.crt

# Secrets written by init-secrets (INFRA-4) are loaded from /run/secrets/secrets.properties:
# the Dockerfile sets QUARKUS_CONFIG_LOCATIONS (that file has config_ordinal=270, above this file).

# Service identity and outgoing calls (INFRA-7)
tamer.service-client.id=encounters
%dev.tamer.service-client.secret=dev-only-secret
%test.tamer.service-client.secret=test-only-secret
quarkus.rest-client.auth.url=${TAMER_AUTH_URL:http://localhost:8081}
%prod.quarkus.rest-client.auth.tls-configuration-name=internal

# Internal dependencies (EN-3): wild pool, stats, reward, XP, archive / team / new run / history record
quarkus.rest-client.monsters.url=${TAMER_MONSTERS_URL:http://localhost:8083}
quarkus.rest-client.teams.url=${TAMER_TEAMS_URL:http://localhost:8084}
quarkus.rest-client.players.url=${TAMER_PLAYERS_URL:http://localhost:8082}
quarkus.rest-client.history.url=${TAMER_HISTORY_URL:http://localhost:8086}
%prod.quarkus.rest-client.monsters.tls-configuration-name=internal
%prod.quarkus.rest-client.teams.tls-configuration-name=internal
%prod.quarkus.rest-client.players.tls-configuration-name=internal
%prod.quarkus.rest-client.history.tls-configuration-name=internal

# Battles (R19): in memory, closed as expired after this idle time
tamer.battle.idle-timeout=PT30M
