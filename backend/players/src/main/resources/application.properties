quarkus.http.port=8080
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/players}
quarkus.datasource.username=${DB_USER:players}
quarkus.datasource.password=${DB_PASSWORD:players}
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.jackson.property-naming-strategy=SNAKE_CASE

mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY:file:/secrets/jwt-public.pem}
mp.jwt.verify.issuer=monster-tamers

internal.token=${INTERNAL_TOKEN:dev-internal-token}
quarkus.rest-client.monsters.url=${MONSTERS_URL:http://monsters:8080}
quarkus.rest-client.monsters.connect-timeout=2000
quarkus.rest-client.monsters.read-timeout=3000
quarkus.rest-client.history.url=${HISTORY_URL:http://history:8080}
quarkus.rest-client.history.connect-timeout=2000
quarkus.rest-client.history.read-timeout=3000

quarkus.smallrye-openapi.path=/players/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/players/swagger-ui
quarkus.swagger-ui.urls.default=/api/players/openapi
quarkus.log.level=INFO
