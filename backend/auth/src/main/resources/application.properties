# ---------------------------------------------------------------------------
# auth - see docs/plan/02-infrastructure.md (INFRA-1, INFRA-3, INFRA-4, INFRA-7)
# Profiles: %dev / %test use Dev Services and plain HTTP; %prod (containers) enforces TLS.
# Secrets are never written here: in prod they come from /run/secrets/secrets.properties.
# ---------------------------------------------------------------------------
quarkus.application.name=auth
%dev.quarkus.http.port=8081
quarkus.http.test-port=0
quarkus.http.auth.proactive=false

# JSON
quarkus.jackson.property-naming-strategy=SNAKE_CASE
quarkus.jackson.fail-on-unknown-properties=true

# Persistence
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://auth-db:5432/auth?sslmode=verify-full&sslrootcert=/run/secrets/ca.crt
%prod.quarkus.datasource.username=auth_app

# OpenAPI
quarkus.smallrye-openapi.info-title=Monster Tamers - auth
quarkus.smallrye-openapi.store-schema-directory=target/openapi
# OpenAPI (DOC-1): Bearer JWT scheme, added automatically to every @RolesAllowed operation
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearerAuth
quarkus.smallrye-openapi.security-scheme-description=JWT access token from the auth service (player or service role)
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.smallrye-openapi.operation-id-strategy=CLASS_METHOD
quarkus.smallrye-openapi.info-description=Accounts and OAuth2 tokens. Players: POST /api/auth/token with grant_type=password (form-urlencoded). Services: POST /internal/auth/token with grant_type=client_credentials. The access token is an RS256 JWT, sent as Authorization: Bearer.

# Logging (request id from RequestIdFilter)
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%X{request_id}] %c{2.} %s%e%n

# JWT verification (all services)
mp.jwt.verify.issuer=tamer-auth
mp.jwt.verify.audiences=tamer-api,tamer-internal
smallrye.jwt.path.groups=groups
%prod.mp.jwt.verify.publickey.location=/run/secrets/jwt-public.pem

# TLS (prod only)
%prod.quarkus.http.ssl-port=8443
%prod.quarkus.http.insecure-requests=disabled
%prod.quarkus.tls.key-store.pem.0.cert=/run/secrets/tls/server.crt
%prod.quarkus.tls.key-store.pem.0.key=/run/secrets/tls/server.key
%prod.quarkus.tls.internal.trust-store.pem.certs=/run/secrets/ca.crt

# Secrets written by init-secrets (INFRA-4) are loaded from /run/secrets/secrets.properties:
# the Dockerfile sets QUARKUS_CONFIG_LOCATIONS (that file has config_ordinal=270, above this file).

# ---------------------------------------------------------------------------
# auth only
# ---------------------------------------------------------------------------
# Token signing (the private key exists only in the auth container)
%prod.smallrye.jwt.sign.key.location=/run/secrets/jwt-private.pem
# Access token lifetime in seconds (env TAMER_ACCESS_TOKEN_TTL). P1: 3600, P2 with refresh tokens: 900
tamer.access-token-ttl=3600
tamer.service-token-ttl=300
# The "tests" client is accepted only when the test override sets TAMER_TEST_CLIENT_ENABLED=true
tamer.test-client.enabled=false

# Known service clients: tamer.service-clients.<client_id>=<secret> (prod: from secrets.properties)
%dev.tamer.service-clients.players=dev-only-secret
%dev.tamer.service-clients.teams=dev-only-secret
%dev.tamer.service-clients.encounters=dev-only-secret
%test.tamer.service-clients.players=test-only-secret
%test.tamer.service-clients.tests=test-tests-secret

# Outgoing call: players (profile creation)
quarkus.rest-client.players.url=${TAMER_PLAYERS_URL:http://localhost:8082}
%prod.quarkus.rest-client.players.tls-configuration-name=internal
