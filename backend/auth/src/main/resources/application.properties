quarkus.http.port=8080
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/auth}
quarkus.datasource.username=${DB_USER:auth}
quarkus.datasource.password=${DB_PASSWORD:auth}
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.jackson.property-naming-strategy=SNAKE_CASE

mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY:file:/secrets/jwt-public.pem}
mp.jwt.verify.issuer=monster-tamers
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY:file:/secrets/jwt-private.pem}
auth.token.ttl-seconds=3600
auth.lockout.max-attempts=5
auth.lockout.minutes=5

internal.token=${INTERNAL_TOKEN:dev-internal-token}
quarkus.rest-client.players.url=${PLAYERS_URL:http://players:8080}

quarkus.smallrye-openapi.path=/auth/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/auth/swagger-ui
quarkus.swagger-ui.urls.default=/api/auth/openapi
quarkus.log.level=INFO
