# Re-encrypts to the services and verifies their certificate against the local CA.
# Each location sets $upstream_host before including this file.
proxy_pass https://$upstream_host:8443;
proxy_ssl_verify on;
proxy_ssl_verify_depth 2;
proxy_ssl_trusted_certificate /run/secrets/ca.crt;
proxy_ssl_server_name on;
proxy_ssl_name $upstream_host;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Request-Id $request_id;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_connect_timeout 3s;
proxy_read_timeout 15s;
# Never forward the services' own CORS headers (the gateway owns CORS)
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header X-Request-Id;
