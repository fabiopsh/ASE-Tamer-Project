# Re-encrypts to the services and verifies their certificate against the local CA.
# Each location sets $upstream_host before including this file.
# $upstream_host is always a literal service name set by the location, never request data.
proxy_pass https://$upstream_host:8443; # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
proxy_ssl_verify on;
proxy_ssl_verify_depth 2;
proxy_ssl_trusted_certificate /run/secrets/ca.crt;
proxy_ssl_server_name on;
proxy_ssl_name $upstream_host;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
proxy_http_version 1.1;
# The services see their own name, never the client's Host header (CI-2, Semgrep request-host-used)
proxy_set_header Host $upstream_host;
proxy_set_header X-Request-Id $request_id;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
# Never forward any subject/identity metadata to backends; services always verify the bearer JWT
proxy_set_header X-Auth-Subject "";
proxy_connect_timeout 3s;
proxy_read_timeout 15s;
proxy_send_timeout 15s;
# Never forward the services' own CORS headers (the gateway owns CORS)
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Expose-Headers;
proxy_hide_header Access-Control-Max-Age;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header X-Request-Id;
