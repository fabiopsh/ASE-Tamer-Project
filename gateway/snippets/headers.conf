# Security and CORS headers included at server level and inside error locations that emit extra headers.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
add_header X-Request-Id $request_id always;
# CORS (an empty value means the header is not sent)
add_header Access-Control-Allow-Origin $cors_origin always;
add_header Access-Control-Allow-Methods $cors_methods always;
add_header Access-Control-Allow-Headers $cors_headers always;
add_header Access-Control-Expose-Headers $cors_expose always;
add_header Access-Control-Max-Age $cors_max_age always;
add_header Vary "Origin" always;
