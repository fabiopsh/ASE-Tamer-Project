worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    client_max_body_size 256k;
    gzip on;
    gzip_types application/json application/javascript text/css;

    # Docker DNS: upstreams are resolved per request, so the gateway starts even if a service is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/s;
    limit_req_status 429;

    map $uri $api_service {
        ~^/api/collection(/|$)                                              monsters;
        ~^/api/(?<svc>auth|players|monsters|teams|encounters|history)(/|$)  $svc;
        default                                                             "";
    }

    server {
        listen 80;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        ssl_certificate     /tls/tls.crt;
        ssl_certificate_key /tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;

        # Swagger UI needs inline scripts: same routing, no CSP.
        location ~ ^/api/[a-z]+/swagger-ui {
            if ($api_service = "") { return 404; }
            add_header X-Content-Type-Options "nosniff" always;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$api_service:8080;
        }

        location /api/auth/ {
            limit_req zone=auth burst=60 nodelay;
            set $auth_service auth;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$auth_service:8080;
        }

        # /api/<svc>/... -> <svc>:8080/<svc>/...  (/internal/* and /q/* are never reachable from here)
        location /api/ {
            if ($api_service = "") { return 404; }
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$api_service:8080;
        }

        location /images/ {
            set $images monsters;
            expires 7d;
            proxy_pass http://$images:8080;
        }

        # The frontend uses hash routes, so unknown paths (e.g. /internal, /q) are plain 404s.
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ =404;
            location = /index.html { root /usr/share/nginx/html; add_header Cache-Control "no-cache"; }
        }
    }
}
