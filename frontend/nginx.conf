# Static server of the frontend. Reached only by the gateway (backend network), over TLS
# with a certificate signed by the local CA. Security headers are added by the gateway.
server {
    listen 8443 ssl;
    http2 on;
    server_name frontend;

    ssl_certificate     /run/secrets/tls/server.crt;
    ssl_certificate_key /run/secrets/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    root /usr/share/nginx/html;

    # Hashed file names: safe to cache for a long time
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths load index.html and the router handles them
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
