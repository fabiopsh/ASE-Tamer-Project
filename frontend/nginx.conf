# Static server of the frontend. It holds no secret and talks to nobody: the browser
# loads the app from here and calls the gateway directly (CORS is handled there).

# Hashed file names under /assets/ never change: cache them for a long time
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 8080;
    server_name localhost;

    server_tokens off;
    root /usr/share/nginx/html;

    # No location below sets add_header, so these apply everywhere.
    # X-Frame-Options because browsers ignore frame-ancestors in the <meta> CSP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control $cache_control always;

    location /assets/ {
        try_files $uri =404;
    }

    # Single-page app: unknown paths load index.html and the router handles them
    location / {
        try_files $uri /index.html;
    }
}
